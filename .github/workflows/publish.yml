name: Publish to npm

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.event.release.tag_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: >-
          node --input-type=module -e
          "import pkg from './package.json' with { type: 'json' };
          const expectedTag = 'v' + pkg.version;
          const packageIsPrerelease = pkg.version.includes('-');
          const releaseIsPrerelease = process.env.RELEASE_IS_PRERELEASE === 'true';
          if (process.env.RELEASE_TAG !== expectedTag) throw new Error('Release tag ' + process.env.RELEASE_TAG + ' does not match package version ' + expectedTag);
          if (releaseIsPrerelease !== packageIsPrerelease) throw new Error('GitHub prerelease setting does not match package version ' + pkg.version);"

      - name: Install dependencies
        run: npm ci

      - name: Run runtime tests
        run: npm test

      - name: Check TypeScript declarations
        run: npm run test:types

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish prerelease
        if: github.event.release.prerelease
        run: npm publish --access public --tag next

      - name: Publish stable release
        if: ${{ !github.event.release.prerelease }}
        run: npm publish --access public
